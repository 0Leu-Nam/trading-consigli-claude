# Configurazione centrale dell'app.
# Ogni modulo si attiva/disattiva col flag `enabled`. L'orchestratore carica
# solo i moduli con enabled: true. Nessuna chiave API qui: solo nel file .env.

database:
  path: data/app.db

run:
  default_lookback_days: 7
  partial_error_threshold: 0   # errori parziali (es. singoli filing falliti) OLTRE questa soglia → run 'warning'; 0 = una qualsiasi anomalia

modules:
  insider_trading:
    enabled: true           # FASE 1 — SEC EDGAR Form 4
    lookback_days: 7
    min_value_usd: 50000
    open_market_only: false
    max_filings: 250        # cap per run (1 hit EFTS = 1 filing); alza per più copertura
  price_screener:
    enabled: true           # FASE 3 — anomalie prezzo/volume
    period_days: 30         # finestra OHLCV da scaricare (serve lookback per le medie)
    history_days: 25        # barre salvate in price_snapshots per ticker (~500×25 righe steady-state)
    vol_spike_mult: 3.0     # soglia spike usata dalla fase di scoring (Fase 6)
    max_symbols: 500        # cap per run
    universe: file:data/sp500.txt   # o inline list: ["AAPL", ...]
  news_sentiment:
    enabled: true           # FASE 4 — notizie + sentiment (attivata il 2026-09-27 dopo chiusura Fase 2/3 = 100%)
    sources: [marketaux, yahoo_finance_rss]
    sentiment_gte: 0.35     # soglia label positive/negative (score in [-1,1])
    max_symbols: 40         # cap ticker per run (priorità: insider recente, poi watchlist, poi universe)
    lookback_insider_days: 7
    universe: file:data/sp500.txt
  institutional_holdings:
    enabled: true           # FASE 5 — 13F trimestrale (attivata in produzione il 2026-10-01)
    lag_days: 60            # ritardo pubblicazione 13F: processa solo trimestri chiusi da almeno 60gg (15gg di margine oltre il deadline SEC di 45gg)
    quarters_back: 2        # quanti trimestri chiusi per run (più recente prima)
    max_filings: 6          # TETTO per trimestre, non obiettivo da riempire: con la whitelist attiva gli slot in eccesso restano liberi. 6 lascia margine agli eventuali 13F-HR/A dei 3 gestori (12 XML/run, non 240)
    max_filings_scan: 200   # hit EFTS esaminate per trimestre solo nel percorso generico; con filer_cik_filter la ricerca è già filtrata lato server (1 richiesta/finestra)
    skip_put_call: true     # scarta le posizioni su opzioni (putCall valorizzato)
    cusip_ttl_days: 60      # validità della cache cusip_lookup prima di ri-risolvere il nome
    core_name_matching: true  # 2° tier: match sui token del nome senza suffissi legali (es. "CHEVRON CORPORATION" → "CHEVRON CORP"); solo se univoco
    filer_cik_filter: ["0001541617", "0002045724", "0001263508"]    # CIK 10 cifre: Altimeter Capital, Situational Awareness LP, Baker Bros. Advisors — ESCLUSIVI: si raccolgono solo questi (filtro server EFTS, vedi README); vuoto = ordine EFTS, primi N
    fill_remaining_with_generic: false  # riempie gli slot liberi con altri filer: default false con whitelist attiva (i fileri estranei non richiesti è stato il bug del run #16); ignorato se filer_cik_filter è vuoto
  scoring:
    enabled: true            # FASE 6 — attivata in produzione il 2026-10-04 dopo osservazione locale: 220/220 test verdi e shortlist a due sezioni riletta e approvata sui dati reali
    recalc: false            # false = INSERT OR IGNORE (run ripetuti non riscrivono); true = ricalcola e sovrascrive gli score della stessa data
    min_signals: 2           # moduli minimi distinti per la shortlist MULTIPLA: sotto questo è un punteggio da fonte singola
    single_source_min: 40    # soglia di score perché un segnale a fonte singola entri comunque in shortlist, in sezione separata. 40 sta nel vuoto naturale della finestra reale: sotto c'era 39, sopra 45. Serve perché min_signals escludeva i segnali più puri del run (CLPR, insider che compra il 100% della propria posizione)
    single_source_limit: 10  # tetto alle voci della sezione fonte singola, così non può sommergere la convergenza multipla
    shortlist_size: 25
    conflict_min_weight: 10  # etichetta 'segnali contrastanti' nella riga di sintesi quando un contributo positivo E uno negativo superano questo peso. NON cambia lo score: lo rende onesto. Caso reale CBRS: -20 insider sell e +50 institutional new = +35 pieno ma a meta'.
    warn_institutional_age_days: 150  # NON e' un gate: i 13F vecchi continuano a contribuire, ma se il deposito piu' vecchio usato nel run supera questa eta' la nota del modulo dice che il modulo 13F potrebbe aver smesso di depositare. 150 e non 180 perche' il deadline SEC e' 45gg dalla fine del trimestre: 150 sul deposito = due trimestri mancati
    windows:                 # ogni modulo ha la sua finestra: il 13F è trimestrale con 45-90gg di lag, non ha senso paragonarlo a una finestra settimanale. Ogni finestra è ancorata alla data massima della PROPRIA tabella sorgente, non a date('now'): con l'orologio la stessa finestra dava risultati diversi a poche ore di distanza sullo stesso dataset
      insider:   {days: 7, min_value_usd: 50000, open_market_only: true}
      price:     {days: 5, vol_spike_mult: 3.0, move_5d_pct: 0.10}
      news:      {days: 14, positive_gte: 0.35, negative_lte: -0.35, min_articles: 3}
      institutional: {quarters: 1}
    insider_scale:           # il peso insider NON e' fisso: una vendita del 61% della propria posizione e un taglio dello 0.6% erano entrambi -20. Contributo = peso_base x banda(frazione) x banda(n. insider), limitato a max_abs
      frac_buy:  [{lt: 0.01, mult: 0.15}, {gte: 0.50, mult: 1.6}, {gte: 0.20, mult: 1.3}, {gte: 0.05, mult: 1.0}, {gte: 0.0, mult: 0.7}]  # acquisto: shares/holdings_after, cioe' la quota della posizione comprata. La banda 'lt' in testa e' la soglia TRASCURABILE: sotto l'1% non c'e' convinzione, c'e' rumore (AFL vendeva lo 0.018% e prendeva -14.0, il peso di una vendita vera). Va per prima: sotto un tetto precedente la banda successiva non viene mai valutata
      frac_sell: [{lt: 0.01, mult: 0.15}, {gte: 0.50, mult: 1.6}, {gte: 0.20, mult: 1.3}, {gte: 0.05, mult: 1.0}, {gte: 0.0, mult: 0.7}]  # vendita: shares/(shares+holdings_after) = quota venduta; holdings_after=0 e' uscita completa = 1.0. Banda trascurabile SIMMETRICA con gli acquisti: comprare lo 0.5% della propria posizione non dimostra convinzione nemmeno se costa 33.7M
      by_insider_count: [{gte: 4, mult: 1.35}, {gte: 2, mult: 1.15}, {gte: 1, mult: 1.0}]  # su persone DISTINTE (CBRS: 36 dichiarazioni da 3 insider), non su righe di Form 4
      usd_fallback:          # solo per le dichiarazioni senza holdings_after (2.7% del valore nella finestra reale): si ripiega sul valore in dollari
        buy:  [{gte_usd: 50000000, mult: 1.40}, {gte_usd: 10000000, mult: 1.13}, {gte_usd: 1000000, mult: 0.93}, {gte_usd: 250000, mult: 0.67}, {gte_usd: 0, mult: 0.40}]
        sell: [{gte_usd: 50000000, mult: 1.30}, {gte_usd: 10000000, mult: 1.10}, {gte_usd: 1000000, mult: 0.90}, {gte_usd: 250000, mult: 0.65}, {gte_usd: 0, mult: 0.35}]
      max_abs: 60            # tetto sul contributo insider assoluto: 30 x 1.6 x 1.35 = 64.8 non e' piu' un segnale, e' il tetto che tiene sotto i +100 dei 4 moduli. Era 45 e tagliava solo acquisti (6 ticker persi, per clippare a 55.2), le vendite reali non ci arrivano mai: il massimo osservato e' 36.8
    weights:                 # nessun peso è hardcoded: ogni regola ha il suo numero qui e la sua spiegazione nel README
      insider_open_market_buy: 30    # P open-market sopra min_value_usd nella finestra: peso BASE, moltiplicato per insider_scale.frac_buy
      insider_open_market_sell: -20  # S open-market sopra soglia: peso BASE, moltiplicato per insider_scale.frac_sell (resta negativo)
      price_volume_spike: 15         # vol_vs_avg_20 >= vol_spike_mult (spinta di acquisto, non direzione)
      price_move_up: 10              # rendimento 5gg >= move_5d_pct, col segno: un ribasso non premia
      news_sentiment_positive: 20    # media sentiment >= positive_gte su almeno min_articles articoli
      news_sentiment_negative: -15   # media sentiment <= negative_lte su almeno min_articles articoli
      institutional_new_position: 25 # posizione aperta nel trimestre da un gestore in filer_cik_filter
      institutional_increase: 15     # posizione aumentata rispetto al trimestre precedente
      institutional_multiple: 5      # piu' gestori whitelistati che aprono/aumentano la stessa posizione

notifications:
  telegram:
    enabled: false          # FASE 8

dashboard:
  format: html_static       # GitHub Pages