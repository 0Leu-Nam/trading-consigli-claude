[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-consigli-claude"
version = "0.1.0"
description = "App di supporto alle decisioni di investimento: screening e segnalazione da fonti pubbliche (NESSUN trading automatico)."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "yfinance>=0.2.55",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["core", "scoring", "dashboard"]

[tool.setuptools.package-dir]
core = "core"
scoring = "scoring"
dashboard = "dashboard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"